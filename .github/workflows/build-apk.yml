name: Build ENFINET OPC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ENFINET-OPC-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

5. Pindutin ang **Commit changes** at kumpirmahin ang pag-save.

## Hakbang 3: Bago patakbuhin

May isang mahalagang kondisyon: kailangang nasa root ng repository ang `package.json`, `capacitor.config.json`, at folder na `www`. Kung ZIP lang ang in-upload mo, maaaring hindi makita ng workflow ang mga ito.

**Pagkatapos mong gawin ang Hakbang 1, i-send mo muna ang screenshot ng Code tab.** Titingnan natin ang laman ng repository bago patakbuhin ang build para maiwasan ang error.
