name: Build ENFINET OPC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnose project files
        run: |
          echo "=== ROOT DIRECTORY ==="
          pwd
          ls -la

          echo "=== CHECK REQUIRED FILES ==="

          if [ ! -f package.json ]; then
            echo "ERROR: package.json is missing from the root directory."
            exit 1
          fi

          if [ ! -f capacitor.config.json ]; then
            echo "ERROR: capacitor.config.json is missing from the root directory."
            exit 1
          fi

          if [ ! -f www/index.html ]; then
            echo "ERROR: www/index.html is missing."
            echo "The www folder must be in the root directory."
            ls -la www || true
            exit 1
          fi

          echo "SUCCESS: All required files are present."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ENFINET-OPC-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
